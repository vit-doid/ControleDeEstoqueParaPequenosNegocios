<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --border: #e2e5ec;
      --primary: #2563eb;
      --primary-text: #ffffff;
      --danger: #dc2626;
      --ok: #16a34a;
      --warn-bg: #fef3c7;
      --warn: #92400e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1b2030;
        --text: #e8ebf3;
        --muted: #99a1b5;
        --border: #2c3348;
        --primary: #4f8cff;
        --primary-text: #0b1020;
        --danger: #f87171;
        --ok: #4ade80;
        --warn-bg: #3b2f0b;
        --warn: #fcd34d;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px 0;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.4rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 48px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .card small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .card strong { font-size: 1.35rem; }
    .card.alerta strong { color: var(--danger); }

    input, select, button {
      font: inherit;
      color: inherit;
    }

    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
    }

    button {
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
    }

    button:hover { border-color: var(--primary); }

    button.primary {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
      font-weight: 600;
    }

    button.mini {
      padding: 4px 9px;
      font-size: .85rem;
    }

    button.perigo { color: var(--danger); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    #busca {
      flex: 1;
      min-width: 180px;
    }

    .filtro-baixo {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: .9rem;
    }

    .filtro-baixo input {
      width: auto;
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    button.tab.ativa {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .tabela {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
    }

    tr:last-child td { border-bottom: 0; }

    td.num, th.num { text-align: right; }

    .acoes {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .vazio {
      padding: 32px 12px;
      text-align: center;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 600;
      background: var(--warn-bg);
      color: var(--warn);
    }

    .entrada { color: var(--ok); font-weight: 600; }
    .saida { color: var(--danger); font-weight: 600; }

    dialog {
      width: min(440px, 92vw);
      padding: 22px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    dialog::backdrop { background: rgba(0, 0, 0, .45); }

    dialog h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: .85rem;
      color: var(--muted);
    }

    label input,
    label select {
      display: block;
      width: 100%;
      margin-top: 4px;
      color: var(--text);
    }

    .linha {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .rodape {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .erro {
      min-height: 1.2em;
      margin: 0 0 4px;
      font-size: .9rem;
      color: var(--danger);
    }
  </style>
</head>

<body>

  <header>
    <h1>Controle de Estoque</h1>
  </header>

  <main>
    <section class="cards" id="resumo"></section>

    <div class="toolbar">
      <input id="busca" type="search" placeholder="Buscar por nome, código ou categoria…">

      <label class="filtro-baixo" id="filtroBaixo">
        <input type="checkbox" id="soBaixo"> Só estoque baixo
      </label>

      <button class="primary" id="novo">+ Novo produto</button>

      <div class="tabs">
        <button class="tab ativa" data-aba="produtos">Produtos</button>
        <button class="tab" data-aba="historico">Histórico</button>
      </div>
    </div>

    <div class="tabela">
      <table id="tabela"></table>
    </div>
  </main>

  <dialog id="dlgProduto">
    <form method="dialog" id="formProduto">
      <h2 id="tituloProduto">Novo produto</h2>

      <label>Nome *
        <input name="nome" required>
      </label>

      <div class="linha">
        <label>Código / SKU
          <input name="codigo">
        </label>
        <label>Categoria
          <input name="categoria">
        </label>
      </div>

      <div class="linha">
        <label>Preço de custo (R$)
          <input name="custo" type="number" min="0" step="0.01" value="0">
        </label>
        <label>Preço de venda (R$)
          <input name="preco" type="number" min="0" step="0.01" value="0">
        </label>
      </div>

      <div class="linha">
        <label id="lblQtd">Quantidade inicial
          <input name="quantidade" type="number" min="0" step="1" value="0">
        </label>
        <label>Estoque mínimo
          <input name="minimo" type="number" min="0" step="1" value="0">
        </label>
      </div>

      <p class="erro" id="erroProduto"></p>

      <div class="rodape">
        <button type="button" data-fechar>Cancelar</button>
        <button class="primary" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgMov">
    <form method="dialog" id="formMov">
      <h2 id="tituloMov"></h2>

      <label>Tipo
        <select name="tipo">
          <option value="entrada">Entrada (compra / reposição)</option>
          <option value="saida">Saída (venda / perda)</option>
        </select>
      </label>

      <label>Quantidade
        <input name="quantidade" type="number" min="1" step="1" value="1" required>
      </label>

      <label>Observação
        <input name="observacao" placeholder="Ex.: venda balcão, compra fornecedor X">
      </label>

      <p class="erro" id="erroMov"></p>

      <div class="rodape">
        <button type="button" data-fechar>Cancelar</button>
        <button class="primary" type="submit">Registrar</button>
      </div>
    </form>
  </dialog>

  <script>
    const $ = (seletor) => document.querySelector(seletor);

    const brl = (valor) =>
      valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    const esc = (texto) =>
      String(texto ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));

    let produtos = [];
    let abaAtual = 'produtos';
    let editandoId = null;
    let movId = null;

    async function api(url, opcoes = {}) {
      const resposta = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...opcoes
      });

      if (resposta.status === 204) return null;

      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro || 'Erro inesperado.');
      return dados;
    }

    function renderResumo(resumo) {
      $('#resumo').innerHTML = `
        <div class="card"><small>Produtos</small><strong>${resumo.totalProdutos}</strong></div>
        <div class="card"><small>Unidades em estoque</small><strong>${resumo.totalUnidades}</strong></div>
        <div class="card"><small>Valor a custo</small><strong>${brl(resumo.valorCusto)}</strong></div>
        <div class="card"><small>Valor de venda</small><strong>${brl(resumo.valorVenda)}</strong></div>
        <div class="card ${resumo.baixoEstoque ? 'alerta' : ''}"><small>Estoque baixo</small><strong>${resumo.baixoEstoque}</strong></div>`;
    }

    function mostrarFiltros(visivel) {
      const display = visivel ? '' : 'none';
      $('#busca').style.display = display;
      $('#filtroBaixo').style.display = display;
      $('#novo').style.display = display;
    }

    async function renderHistorico() {
      const movs = await api('/api/movimentacoes');

      const linhas = movs.length
        ? movs.map((m) => `
            <tr>
              <td>${new Date(m.data).toLocaleString('pt-BR')}</td>
              <td>${esc(m.produto)}</td>
              <td class="${m.tipo}">${m.tipo === 'entrada' ? '▲ Entrada' : '▼ Saída'}</td>
              <td class="num">${m.quantidade}</td>
              <td>${esc(m.observacao)}</td>
            </tr>`).join('')
        : `<tr><td colspan="5" class="vazio">Nenhuma movimentação ainda.</td></tr>`;

      $('#tabela').innerHTML = `
        <thead>
          <tr>
            <th>Data</th><th>Produto</th><th>Tipo</th>
            <th class="num">Qtd</th><th>Observação</th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>`;
    }

    function filtrarProdutos() {
      const q = $('#busca').value.toLowerCase().trim();
      const soBaixo = $('#soBaixo').checked;

      return produtos.filter((p) =>
        (!q || [p.nome, p.codigo, p.categoria].some((c) => c.toLowerCase().includes(q))) &&
        (!soBaixo || p.quantidade <= p.minimo)
      );
    }

    function linhaProduto(p) {
      return `
        <tr>
          <td>${esc(p.nome)}</td>
          <td>${esc(p.codigo) || '—'}</td>
          <td>${esc(p.categoria) || '—'}</td>
          <td class="num">${p.quantidade} ${p.quantidade <= p.minimo ? '<span class="badge">baixo</span>' : ''}</td>
          <td class="num">${brl(p.custo)}</td>
          <td class="num">${brl(p.preco)}</td>
          <td>
            <div class="acoes">
              <button class="mini primary" data-mov="${p.id}">± Estoque</button>
              <button class="mini" data-edit="${p.id}">Editar</button>
              <button class="mini perigo" data-del="${p.id}">Excluir</button>
            </div>
          </td>
        </tr>`;
    }

    function renderProdutos() {
      const lista = filtrarProdutos();

      const linhas = lista.length
        ? lista.map(linhaProduto).join('')
        : `<tr><td colspan="7" class="vazio">Nenhum produto encontrado. Clique em “+ Novo produto” para começar.</td></tr>`;

      $('#tabela').innerHTML = `
        <thead>
          <tr>
            <th>Produto</th><th>Código</th><th>Categoria</th>
            <th class="num">Estoque</th><th class="num">Custo</th><th class="num">Venda</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${linhas}</tbody>`;
    }

    async function desenhar() {
      mostrarFiltros(abaAtual === 'produtos');

      if (abaAtual === 'historico') {
        await renderHistorico();
      } else {
        renderProdutos();
      }
    }

    async function atualizar() {
      const [resumo, lista] = await Promise.all([api('/api/resumo'), api('/api/produtos')]);
      produtos = lista;
      renderResumo(resumo);
      await desenhar();
    }

    function abrirNovoProduto() {
      editandoId = null;
      $('#formProduto').reset();
      $('#tituloProduto').textContent = 'Novo produto';
      $('#lblQtd').style.display = '';
      $('#erroProduto').textContent = '';
      $('#dlgProduto').showModal();
    }

    function abrirEditarProduto(p) {
      editandoId = p.id;

      const form = $('#formProduto');
      form.reset();
      for (const campo of ['nome', 'codigo', 'categoria', 'custo', 'preco', 'minimo']) {
        form.elements[campo].value = p[campo];
      }

      $('#tituloProduto').textContent = 'Editar produto';
      $('#lblQtd').style.display = 'none';
      $('#erroProduto').textContent = '';
      $('#dlgProduto').showModal();
    }

    function abrirMovimentacao(p) {
      movId = p.id;
      $('#formMov').reset();
      $('#tituloMov').textContent = `${p.nome} — em estoque: ${p.quantidade}`;
      $('#erroMov').textContent = '';
      $('#dlgMov').showModal();
    }

    async function excluirProduto(p) {
      if (!confirm(`Excluir "${p.nome}"? Essa ação não pode ser desfeita.`)) return;
      await api(`/api/produtos/${p.id}`, { method: 'DELETE' });
      atualizar();
    }

    document.querySelectorAll('.tab').forEach((botao) => {
      botao.addEventListener('click', () => {
        abaAtual = botao.dataset.aba;
        document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('ativa', x === botao));
        desenhar();
      });
    });

    $('#busca').addEventListener('input', desenhar);
    $('#soBaixo').addEventListener('change', desenhar);

    document.querySelectorAll('[data-fechar]').forEach((botao) => {
      botao.addEventListener('click', () => botao.closest('dialog').close());
    });

    $('#novo').addEventListener('click', abrirNovoProduto);

    $('#tabela').addEventListener('click', (e) => {
      const botao = e.target.closest('button');
      if (!botao) return;

      const achar = (id) => produtos.find((x) => x.id == id);

      if (botao.dataset.edit) abrirEditarProduto(achar(botao.dataset.edit));
      else if (botao.dataset.mov) abrirMovimentacao(achar(botao.dataset.mov));
      else if (botao.dataset.del) excluirProduto(achar(botao.dataset.del));
    });

    $('#formProduto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const corpo = Object.fromEntries(new FormData(e.target));

      try {
        await api(
          editandoId ? `/api/produtos/${editandoId}` : '/api/produtos',
          { method: editandoId ? 'PUT' : 'POST', body: JSON.stringify(corpo) }
        );
        $('#dlgProduto').close();
        atualizar();
      } catch (err) {
        $('#erroProduto').textContent = err.message;
      }
    });

    $('#formMov').addEventListener('submit', async (e) => {
      e.preventDefault();
      const corpo = Object.fromEntries(new FormData(e.target));

      try {
        await api(`/api/produtos/${movId}/movimentacoes`, {
          method: 'POST',
          body: JSON.stringify(corpo)
        });
        $('#dlgMov').close();
        atualizar();
      } catch (err) {
        $('#erroMov').textContent = err.message;
      }
    });

    atualizar();
  </script>
</body>
</html>
